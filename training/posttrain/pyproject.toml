[project]
name = "health-copilot-posttrain"
version = "0.1.0"
description = "Isolated post-training environment for Health-Copilot"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.10",
    "bitsandbytes>=0.45.5",
    "datasets>=4.0",
    "huggingface-hub>=0.34",
    "numpy",
    "pandas",
    "peft>=0.17",
    "safetensors",
    "sentencepiece",
    "torch==2.13.0+cu130",
    "torchvision==0.28.0+cu130",
    "transformers==5.17.0",
    "trl==1.13.0",
    "unsloth[huggingface] @ git+https://github.com/unslothai/unsloth.git@a550c89b5958fdb713a90b62f8423b294677563b",
    "vllm==0.30.1rc1.dev622+gf03026a54",
]

[dependency-groups]
build = [
    "setuptools @ https://files.pythonhosted.org/packages/9d/76/f789f7a86709c6b087c5a2f52f911838cad707cc613162401badc665acfe/setuptools-82.0.1-py3-none-any.whl#sha256=a59e362652f08dcd477c78bb6e7bd9d80a7995bc73ce773050228a348ce2e5bb",
    "setuptools-scm @ https://files.pythonhosted.org/packages/3d/ea/ac2bf868899d0d2e82ef72d350d97a846110c709bacf2d968431576ca915/setuptools_scm-9.2.2-py3-none-any.whl#sha256=30e8f84d2ab1ba7cb0e653429b179395d0c33775d54807fc5f1dd6671801aef7",
]

[tool.uv]
package = false
cache-dir = ".uv-cache"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
default-groups = ["build"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "vllm-cu130"
url = "https://wheels.vllm.ai/nightly/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
vllm = { index = "vllm-cu130" }
