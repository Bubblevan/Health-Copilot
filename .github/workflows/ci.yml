name: Health-Copilot CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Offline tests
        run: pytest -q

      - name: Replay and assert M0 deterministic baseline
        run: >-
          python tools/check_m0_baseline.py
          --knowledge-dir data/knowledge_cards
          --dataset evals/m0.jsonl
          --baseline evals/baselines/m0.json
