[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-ai-copilot"
version = "0.1.0"
description = "A safety-first patient education and risk-routing AI prototype"
requires-python = ">=3.11"

dependencies = [
    "jieba>=0.42.1",
    "openai>=1.0",
    "mcp==2.2.0",
    "truststore>=0.10",
]

[project.scripts]
health-eval = "health_ai_copilot.eval.cli:main"
health-bench = "health_ai_copilot.benchmarks.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
retrieval = ["sentence-transformers>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
