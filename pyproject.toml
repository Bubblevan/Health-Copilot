[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-ai-copilot"
version = "0.1.0"
description = "A safety-first patient education and risk-routing AI prototype"
requires-python = ">=3.11"

dependencies = [
    "jieba>=0.42.1",
    "openai>=1.0",
    "mcp==2.2.0",
    "truststore>=0.10",
]

[project.scripts]
health-eval = "health_ai_copilot.eval.cli:main"
health-bench = "health_ai_copilot.benchmarks.cli:main"

[project.optional-dependencies]
dev = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "numpy>=1.24",
    "pytest>=8.0",
    "ruff>=0.6",
    "scikit-learn>=1.5",
]
retrieval = ["sentence-transformers>=3.0"]
research = ["scikit-learn>=1.5", "psutil>=6.0; platform_system == 'Windows'"]
huiyi = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "transformers>=4.51",
    "pymilvus==3.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an explicitly configured external service"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Frozen experiment implementations and run snapshots are preserved as evidence;
# Ruff checks maintained application, test, and pipeline code instead.
extend-exclude = [
    "eval/rag_e5/**",
    "runs/**",
    "tools/research/memory/**",
    "tools/research/rag_e5/**",
]

[tool.ruff.lint.isort]
known-first-party = ["eval", "health_ai_copilot"]

[tool.ruff.lint.per-file-ignores]
# Keep the checked-in frozen E5 test import layout byte-for-byte unchanged.
"tests/test_rag_e5_b4.py" = ["I001"]
"tests/test_rag_e5_b4_usage_manifest.py" = ["I001"]

[tool.setuptools.packages.find]
where = ["src"]
