[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-ai-copilot"
version = "0.1.0"
description = "A safety-first patient education and risk-routing AI prototype"
requires-python = ">=3.11"
dependencies = [
    "jieba>=0.42.1",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
